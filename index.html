<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultra Rugby Scoreboard</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#000;
    color:white;
}

/* SCOREBAR */
.scorebar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    background:#111;
}

.team {
    display:flex;
    align-items:center;
    gap:10px;
}

.score { font-size:40px; }
.clock { font-size:28px; text-align:center; }

.panel { padding:10px; }

/* THEMES */
.storm { background:#2b0a3d; }
.broncos { background:#5a0000; }
.default { background:#111; }

/* OVERLAY */
.overlay .panel { display:none; }
</style>
</head>

<body class="default">

<div class="scorebar">
    <div class="team">
        <img id="logo1" width="50">
        <span id="name1">TEAM 1</span>
        <span class="score" id="score1">0</span>
    </div>

    <div class="clock">
        <div id="clock">00:00</div>
        <div id="half">1ST HALF</div>
    </div>

    <div class="team">
        <span class="score" id="score2">0</span>
        <span id="name2">TEAM 2</span>
        <img id="logo2" width="50">
    </div>
</div>

<div class="panel">

<h3>Teams</h3>
<input id="t1" placeholder="Team 1">
<input id="t2" placeholder="Team 2"><br>

<input type="file" onchange="logo(event,1)">
<input type="file" onchange="logo(event,2)">

<h3>Scoring</h3>
<button onclick="tryScore(1)">TRY</button>
<button onclick="goal(1)">GOAL</button>
<button onclick="fg(1)">FG</button>

<button onclick="tryScore(2)">TRY</button>
<button onclick="goal(2)">GOAL</button>
<button onclick="fg(2)">FG</button>

<h3>Game</h3>
<button onclick="start()">Start</button>
<button onclick="pause()">Pause</button>
<button onclick="reset()">Reset</button>
<button onclick="nextHalf()">Next Half</button>

<h3>Extras</h3>
<button onclick="overlay()">Overlay</button>
<button onclick="setTheme('storm')">Storm Theme</button>
<button onclick="setTheme('broncos')">Broncos Theme</button>

<h3>Online Share</h3>
<button onclick="host()">Host Game</button>
<input id="joinCode" placeholder="Enter code">
<button onclick="join()">Join</button>

</div>

<script>
let s1=0,s2=0,sec=0,timer=null,half=1;

// UPDATE
function update(){
    score1.innerText=s1;
    score2.innerText=s2;
    name1.innerText=t1.value||"TEAM 1";
    name2.innerText=t2.value||"TEAM 2";

    let m=Math.floor(sec/60),s=sec%60;
    clock.innerText=String(m).padStart(2,'0')+":"+String(s).padStart(2,'0');
    halfText = half===1?"1ST HALF":"2ND HALF";
    document.getElementById("half").innerText=halfText;

    sendData();
}

// SCORING
function tryScore(t){ if(t===1)s1+=4; else s2+=4; playSound("try"); update();}
function goal(t){ if(t===1)s1+=2; else s2+=2; update();}
function fg(t){ if(t===1)s1+=1; else s2+=1; update();}

// CLOCK
function start(){ if(!timer) timer=setInterval(()=>{sec++;update();},1000);}
function pause(){ clearInterval(timer); timer=null;}
function reset(){ pause(); sec=0; update();}

// HALF
function nextHalf(){
    if(half===1){ half=2; playSound("siren"); }
    else { playSound("siren"); pause(); alert("FULL TIME"); }
    update();
}

// LOGO
function logo(e,t){
    let r=new FileReader();
    r.onload=()=>document.getElementById("logo"+t).src=r.result;
    r.readAsDataURL(e.target.files[0]);
}

// OVERLAY
function overlay(){ document.body.classList.toggle("overlay"); }

// THEMES
function setTheme(t){
    document.body.className=t;
}

// SOUND
function playSound(type){
    let audio=new Audio();
    if(type==="siren") audio.src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg";
    if(type==="try") audio.src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg";
    audio.play();
}

// CONTROLLER SUPPORT
setInterval(()=>{
    let gp=navigator.getGamepads()[0];
    if(!gp) return;

    if(gp.buttons[0].pressed) tryScore(1);
    if(gp.buttons[1].pressed) goal(1);
    if(gp.buttons[2].pressed) fg(1);

    if(gp.buttons[3].pressed) tryScore(2);
},200);

// ONLINE (simple broadcast)
let channel=null;

function host(){
    channel=new BroadcastChannel("scoreboard");
    alert("Hosting started");
}

function join(){
    channel=new BroadcastChannel("scoreboard");
    channel.onmessage=(e)=>{
        let d=e.data;
        s1=d.s1; s2=d.s2; sec=d.sec; half=d.half;
        update();
    };
}

function sendData(){
    if(channel){
        channel.postMessage({s1,s2,sec,half});
    }
}

// PWA INSTALL
if('serviceWorker' in navigator){
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
        self.addEventListener('fetch', e=>{});
    `],{type:'text/javascript'})));
}

update();
</script>

</body>
</html>
