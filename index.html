<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Rugby League Scoreboard</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
}

.scoreboard {
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin-top:40px;
}

.team {
  width:40%;
}

.team img {
  width:100px;
  height:100px;
  object-fit:contain;
}

.score {
  font-size:60px;
  margin:10px;
}

#clock {
  font-size:40px;
  margin-top:20px;
}

button {
  padding:10px;
  margin:5px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>Rugby League Scoreboard</h1>

<div id="clock">00:00</div>
<button onclick="startClock()">Start</button>
<button onclick="pauseClock()">Pause</button>
<button onclick="resetClock()">Reset</button>

<div class="scoreboard">

  <!-- TEAM A -->
  <div class="team">
    <input id="nameA" placeholder="Team A"><br>
    <input type="file" id="logoA"><br>
    <img id="imgA"><br>

    <div class="score" id="scoreA">0</div>

    <button onclick="addScore('A',4)">Try (+4)</button>
    <button onclick="addScore('A',2)">Goal (+2)</button>
    <button onclick="addScore('A',1)">FG (+1)</button>
    <button onclick="addScore('A',-1)">-1</button>
  </div>

  <!-- TEAM B -->
  <div class="team">
    <input id="nameB" placeholder="Team B"><br>
    <input type="file" id="logoB"><br>
    <img id="imgB"><br>

    <div class="score" id="scoreB">0</div>

    <button onclick="addScore('B',4)">Try (+4)</button>
    <button onclick="addScore('B',2)">Goal (+2)</button>
    <button onclick="addScore('B',1)">FG (+1)</button>
    <button onclick="addScore('B',-1)">-1</button>
  </div>

</div>

<script>
// SCORES
let scoreA = 0;
let scoreB = 0;

function addScore(team, pts){
  if(team === 'A'){
    scoreA += pts;
    document.getElementById("scoreA").innerText = scoreA;
  } else {
    scoreB += pts;
    document.getElementById("scoreB").innerText = scoreB;
  }
}

// CLOCK
let seconds = 0;
let timer = null;

function updateClock(){
  seconds++;
  let m = Math.floor(seconds/60);
  let s = seconds % 60;
  document.getElementById("clock").innerText =
    String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
}

function startClock(){
  if(!timer) timer = setInterval(updateClock,1000);
}

function pauseClock(){
  clearInterval(timer);
  timer = null;
}

function resetClock(){
  pauseClock();
  seconds = 0;
  document.getElementById("clock").innerText = "00:00";
}

// LOGOS
document.getElementById("logoA").onchange = e => {
  document.getElementById("imgA").src =
    URL.createObjectURL(e.target.files[0]);
};

document.getElementById("logoB").onchange = e => {
  document.getElementById("imgB").src =
    URL.createObjectURL(e.target.files[0]);
};
</script>

</body>
</html>
