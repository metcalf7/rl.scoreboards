<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRL Live Sync - Match Centre</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --nrl-green: #00b74f; --dark: #0a1612; --card: #14221e; --gold: #ffd700; }
        body { background: var(--dark); color: white; font-family: 'Montserrat', sans-serif; margin: 0; text-align: center; }
        header { background: #000; border-bottom: 3px solid var(--nrl-green); padding: 15px; font-family: 'Oswald'; font-size: 24px; }
        
        .admin-controls { background: #222; padding: 10px; font-size: 12px; border-bottom: 1px solid #444; }
        .admin-only { display: none; }
        .is-admin .admin-only { display: block; }

        /* SCOREBOARD */
        .match-header {
            display: grid; grid-template-columns: 1fr 150px 1fr;
            max-width: 1000px; margin: 20px auto; background: #000;
            padding: 30px; border-radius: 8px; border: 1px solid #263833;
        }
        .team { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .logo { width: 80px; height: 80px; object-fit: contain; background: #111; border-radius: 50%; padding: 5px; }
        .score { font-size: 80px; font-weight: 900; }
        .clock { font-size: 32px; color: var(--gold); font-family: monospace; }

        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: auto; padding: 20px; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #263833; text-align: left; }
        
        .player-row { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); margin-bottom: 5px; padding: 10px; border-radius: 4px; }
        .btn-s { border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold; color: white; margin-left: 5px; }
        .t { background: #1a5a1a; } .c { background: #5a4a1a; }
        
        .timeline { background: #000; height: 120px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; margin-top: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="admin-controls">
    Admin Password: <input type="password" id="pass" oninput="checkAdmin()">
    <span id="status" style="margin-left:20px; color:var(--nrl-green)">● Live Viewer Mode</span>
</div>

<header>NRL MATCH CENTRE - LIVE</header>

<div class="match-header">
    <div class="team">
        <img id="h-logo" class="logo" src="https://via.placeholder.com/80">
        <div id="h-name" style="font-family:Oswald; font-size:24px;">HOME</div>
        <div id="h-score" class="score">0</div>
        <input type="file" class="admin-only" onchange="uploadLogo(this, 'h')">
    </div>
    <div style="display:flex; flex-direction:column; justify-content:center;">
        <div id="timer" class="clock">00:00</div>
        <div class="admin-only">
            <button onclick="sendAction('toggleClock')">START/PAUSE</button>
        </div>
    </div>
    <div class="team">
        <img id="a-logo" class="logo" src="https://via.placeholder.com/80">
        <div id="a-name" style="font-family:Oswald; font-size:24px;">AWAY</div>
        <div id="a-score" class="score">0</div>
        <input type="file" class="admin-only" onchange="uploadLogo(this, 'a')">
    </div>
</div>

<div class="container">
    <div class="panel">
        <h3>HOME SQUAD</h3>
        <input type="text" class="admin-only" placeholder="Team Name" onchange="sendAction('updateName', {side:'h', val:this.value})">
        <div id="h-squad"></div>
    </div>
    <div class="panel">
        <h3>AWAY SQUAD</h3>
        <input type="text" class="admin-only" placeholder="Team Name" onchange="sendAction('updateName', {side:'a', val:this.value})">
        <div id="a-squad"></div>
    </div>
</div>

<div class="panel" style="max-width:960px; margin: 20px auto;">
    <h3>MATCH TIMELINE</h3>
    <div id="log" class="timeline"></div>
    <button class="admin-only btn-s" style="background:red; width:100%; margin-top:10px;" onclick="sendAction('siren')">🚨 TRIGGER FINAL SIREN</button>
</div>

<audio id="siren-sound" src="https://actions.google.com/sounds/v1/alarms/bugle_tune.ogg"></audio>

<script>
    // --- CONFIGURATION ---
    const ABLY_KEY = 'INSERT_ABLY_KEY_HERE'; // <--- PUT YOUR KEY HERE
    const ADMIN_PASS = 'admin123'; 

    const ably = new Ably.Realtime(ABLY_KEY);
    const channel = ably.channels.get('nrl-match');

    let state = { hScore:0, aScore:0, hName:'HOME', aName:'AWAY', log:[], time:'00:00', hLogo:'', aLogo:'' };

    // --- ADMIN CHECK ---
    function checkAdmin() {
        if(document.getElementById('pass').value === ADMIN_PASS) {
            document.body.classList.add('is-admin');
            document.getElementById('status').innerText = "● Admin Mode Active";
        }
    }

    // --- COMMUNICATION ---
    function sendAction(type, data = {}) {
        channel.publish('update', { type, data });
    }

    channel.subscribe('update', (msg) => {
        const { type, data } = msg.data;
        if(type === 'score') {
            if(data.side === 'h') state.hScore += data.pts;
            else state.aScore += data.pts;
            state.log.unshift(`[${state.time}] ${data.pName} +${data.pts}`);
        }
        if(type === 'updateName') state[`${data.side}Name`] = data.val;
        if(type === 'logo') state[`${data.side}Logo`] = data.val;
        if(type === 'siren') document.getElementById('siren-sound').play();
        if(type === 'clock') state.time = data;
        
        updateUI();
    });

    // --- UI UPDATES ---
    function updateUI() {
        document.getElementById('h-score').innerText = state.hScore;
        document.getElementById('a-score').innerText = state.aScore;
        document.getElementById('h-name').innerText = state.hName;
        document.getElementById('a-name').innerText = state.aName;
        document.getElementById('timer').innerText = state.time;
        document.getElementById('log').innerHTML = state.log.map(l => `<div>${l}</div>`).join('');
        if(state.hLogo) document.getElementById('h-logo').src = state.hLogo;
        if(state.aLogo) document.getElementById('a-logo').src = state.aLogo;
    }

    function uploadLogo(input, side) {
        const reader = new FileReader();
        reader.onload = () => sendAction('logo', {side, val: reader.result});
        reader.readAsDataURL(input.files[0]);
    }

    // --- CLOCK (ADMIN ONLY SENDS) ---
    let timerIdx = null;
    let sec = 0;
    function toggleClock() {
        if(timerIdx) { clearInterval(timerIdx); timerIdx = null; }
        else {
            timerIdx = setInterval(() => {
                sec++;
                let m = Math.floor(sec/60).toString().padStart(2,'0');
                let s = (sec%60).toString().padStart(2,'0');
                sendAction('clock', `${m}:${s}`);
            }, 1000);
        }
    }

    // --- INITIAL SQUAD BUILD ---
    function build() {
        ['h', 'a'].forEach(side => {
            const squad = document.getElementById(`${side}-squad`);
            for(let i=1; i<=17; i++) {
                squad.innerHTML += `
                <div class="player-row">
                    <input type="text" placeholder="Player ${i}" id="${side}-p-${i}" style="background:none; border:none; color:white; width:100px;">
                    <div>
                        <button class="btn-s t admin-only" onclick="sendAction('score', {side:'${side}', pts:4, pName:document.getElementById('${side}-p-${i}').value || 'Player ${i}'})">+4</button>
                        <button class="btn-s c admin-only" onclick="sendAction('score', {side:'${side}', pts:2, pName:document.getElementById('${side}-p-${i}').value || 'Player ${i}'})">+2</button>
                    </div>
                </div>`;
            }
        });
    }
    build();
</script>
</body>
</html>
